<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sophomore Materials</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a Linux desktop at dusk. Glass top bar and one file manager window over a drawn mountain wallpaper; plain app layout on phones. */
:root{
  color-scheme: dark;
  --sky:#0f1a2b;
  --panel:rgba(12,17,26,.62);
  --win:rgba(26,32,42,.82);
  --winsolid:#1b222c;
  --side:rgba(255,255,255,.035);
  --ink:#ece6d8;
  --dim:#8f9aa8;
  --amber:#f2b25a;
  --aqua:#72d1bd;
  --rose:#ef7f78;
  --sel:rgba(242,178,90,.16);
  --line:rgba(236,230,216,.10);
  --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--ui);color:var(--ink);font-size:14px;background:var(--sky);overflow:hidden}
a{color:var(--aqua)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#wall{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.shell{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:auto 1fr auto}

/* top bar */
.topbar{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:5px 12px;background:var(--panel);font-size:13px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.tb-left{display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:7px;font-weight:600}
.logo svg{width:16px;height:16px}
.ws{display:flex;gap:5px}
.ws i{width:7px;height:7px;border-radius:4px;background:var(--dim);opacity:.5}
.ws i.on{width:20px;background:var(--amber);opacity:1}
.loc{font-weight:600;letter-spacing:.01em}
.clock{font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.tb-right{display:flex;justify-content:flex-end;align-items:center;gap:12px;color:var(--ink)}
.tb-right svg{width:15px;height:15px;opacity:.9}
.tb-right .user{font-family:var(--mono);font-size:12px;color:var(--dim)}

/* desktop */
.desktop{position:relative;min-height:0;padding:28px 24px 32px;display:grid;
  grid-template-columns:minmax(0,1080px);justify-content:center}
.win{
  display:flex;flex-direction:column;min-height:0;
  background:var(--win);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 24px 60px rgba(0,0,0,.5);
}
.win.hidden{display:none}
.win.max{position:absolute;inset:14px;z-index:5}
.bar{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);
  background:rgba(0,0,0,.18);font-size:13px;font-weight:600;user-select:none}
.bar .t{flex:1;text-align:center;color:var(--ink)}
.bar .t small{font-weight:400;color:var(--dim);font-family:var(--mono);font-size:11.5px;margin-left:6px}
.ctl{display:flex;gap:7px}
.ctl i{width:12px;height:12px;border-radius:50%}
.ctl .c{background:var(--rose)} .ctl .m{background:var(--amber)} .ctl .x{background:var(--aqua)}
.bar .spacer{width:53px}

/* file manager */
.fm{flex:1;min-height:0;display:grid;grid-template-columns:190px minmax(0,1fr)}
.side{background:var(--side);border-right:1px solid var(--line);padding:12px 8px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.side h3{margin:10px 10px 6px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.side h3:first-child{margin-top:0}
.side button,.side a{
  display:flex;align-items:center;gap:9px;width:100%;padding:6px 10px;border-radius:7px;
  background:none;border:0;color:var(--ink);font:inherit;font-size:13px;text-align:left;cursor:pointer;text-decoration:none;
}
.side button:hover,.side a:hover{background:rgba(255,255,255,.06)}
.side button.on{background:var(--sel);color:var(--amber)}
.side svg{width:15px;height:15px;flex:none}
.side .sw{width:9px;height:9px;border-radius:3px;flex:none}
.side .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main{display:flex;flex-direction:column;min-height:0}
.crumbs{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:13px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:7px;padding:5px 10px;color:var(--dim)}
.search:focus-within{border-color:var(--amber)}
.search svg{width:15px;height:15px;flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:inherit;font-size:13px}
.search input::placeholder{color:var(--dim)}
.empty{display:none;color:var(--dim);padding:24px 4px;text-align:center}
.crumbs .oldpath{flex:1;font-family:var(--mono);font-size:12px;background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:7px;padding:5px 10px;color:var(--dim);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.crumbs .path b{color:var(--ink);font-weight:600}
.vbtn{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.vbtn button{background:none;border:0;color:var(--dim);padding:5px 8px;cursor:pointer;display:grid;place-items:center}
.vbtn button.on{background:rgba(255,255,255,.08);color:var(--ink)}
.vbtn svg{width:15px;height:15px}
.view{flex:1;min-height:0;overflow:auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:8px}
.item{display:grid;justify-items:center;align-content:start;gap:10px;padding:16px 8px 12px;border-radius:10px;text-decoration:none;color:var(--ink);text-align:center;border:1px solid transparent}
.item:hover{background:rgba(255,255,255,.06);border-color:var(--line)}
.item:hover svg{transform:translateY(-2px)}
.item svg{width:64px;height:52px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.item .n{font-size:13px;font-weight:500;line-height:1.3;text-wrap:balance}
.item .d{font-family:var(--mono);font-size:11px;color:var(--dim)}
.list{display:none;width:100%;border-collapse:collapse;font-size:13px}
.list th{text-align:left;font-weight:500;color:var(--dim);font-size:12px;padding:6px 10px;border-bottom:1px solid var(--line)}
.list td{padding:8px 10px;border-bottom:1px solid var(--line)}
.list tr:hover td{background:rgba(255,255,255,.04)}
.list a{color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:10px}
.list a svg{width:22px;height:18px;flex:none}
.list .mono{font-family:var(--mono);font-size:12px;color:var(--dim)}
.view.as-list .grid{display:none}
.view.as-list .list{display:table}
.statusbar{display:flex;justify-content:space-between;gap:10px;padding:7px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--dim)}

/* boot */
#boot{position:fixed;inset:0;z-index:50;background:#07090d;font-family:var(--mono);font-size:13px;color:var(--dim);padding:24px;overflow:hidden;cursor:pointer}
#boot .ok{color:var(--aqua)}#boot b{color:var(--ink)}
#boot.gone{opacity:0;pointer-events:none;transition:opacity .4s}
#boot .skip{position:absolute;right:20px;bottom:18px;font-size:12px}

@media (max-width:860px){
  body{overflow:auto;background:#121821}
  #wall{display:none}
  .shell{height:auto;min-height:100%;grid-template-rows:auto 1fr}
  .topbar{position:sticky;top:0;z-index:3;background:#121821;backdrop-filter:none;-webkit-backdrop-filter:none;padding:12px 16px;grid-template-columns:1fr auto}
  .tb-left .logo,.ws{display:none}
  .tb-left{display:none}
  .loc{font-size:17px;font-weight:600}
  .clock{font-size:12px;color:var(--dim)}
  .desktop{padding:0;grid-template-columns:minmax(0,1fr)}
  .win{border:0;border-radius:0;background:transparent;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
  .bar{display:none}
  .fm{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .crumbs{border:0;padding:4px 16px 12px}
  .search{padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.05)}
  .search input{font-size:16px}
  .vbtn{display:none}
  .view{padding:0 16px 16px;overflow:visible}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .item{background:rgba(255,255,255,.04);border:1px solid var(--line);padding:18px 10px 14px}
  .item svg{width:52px;height:42px;filter:none}
  .item:hover svg{transform:none}
  .statusbar{border:0;padding:4px 16px 24px;justify-content:center}
}
@media (prefers-reduced-motion:no-preference){
  .item svg{transition:transform .18s}
  .item,.side button{transition:background .15s}
}
</style>
</head>
<body>
<canvas id="wall" aria-hidden="true"></canvas>

<div id="boot" role="status" aria-live="polite"><div id="bootlog"></div><span class="skip">click or press any key to skip</span></div>

<div class="shell">
  <header class="topbar">
    <div class="tb-left">
      <div class="logo"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="#f2b25a" stroke-width="1.6"/><circle cx="8" cy="8" r="2.6" fill="#72d1bd"/></svg>Sophomore</div>
      <div class="ws" aria-hidden="true"><i class="on"></i><i></i><i></i></div>
    </div>
    <div class="loc" id="loc" aria-live="polite">Home</div>
    <div class="tb-right"><span class="clock" id="clock"></span></div>
  </header>

  <main class="desktop">
    <section class="win" id="winFiles" aria-label="Files">
      <div class="bar">
        <span class="ctl" aria-hidden="true"><i class="c"></i><i class="m"></i><i class="x"></i></span>
        <span class="t">Files</span><span class="spacer"></span>
      </div>
      <div class="fm">
        <aside class="side" aria-label="Places">
          <h3>Places</h3>
          <button class="on" type="button"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M2 7.5L8 2.5l6 5V14H2z"/></svg><span class="lbl">Home</span></button>
          <h3>Courses</h3>
          <div id="sideCourses"></div>
        </aside>
        <div class="main">
          <div class="crumbs">
            <label class="search"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg><input id="q" type="search" placeholder="Search folders and files" aria-label="Search folders and files" autocomplete="off"></label>
            <span class="vbtn" role="group" aria-label="View">
              <button type="button" id="vGrid" class="on" aria-label="Icon view" aria-pressed="true"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg></button>
              <button type="button" id="vList" aria-label="List view" aria-pressed="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 4h12M2 8h12M2 12h12"/></svg></button>
            </span>
          </div>
          <div class="view" id="view">
            <div class="grid" id="grid"></div>
            <p class="empty" id="empty">No folders or files match your search.</p>
            <table class="list"><thead><tr><th>Name</th></tr></thead><tbody id="rows"></tbody></table>
          </div>
          <div class="statusbar"><span id="count"></span></div>
        </div>
      </div>
    </section>

  </main>

</div>

<script>
// ---- Edit this list to add, rename or remove a course ----
var ROOT = "10qel_xLhMw19_bQ6LNBPKP1oaewVh3Wv";
var COURSES = [
  {dir:"selected-topics", name:"Selected Topics",                               id:"1bfMVBSq9zcrWtxdh4zqVsUbNT-sTBajh", tint:"#ef7f78"},
  {dir:"logic-design",    name:"Logic Design and Computer Organization",        id:"1__6g4J2m3jfFQ5ceStRAJlyQqNuET4Cw", tint:"#f2b25a"},
  {dir:"dynamics",        name:"Dynamics",                                      id:"1jAAe1_WKFWeDS5ipLZxaS-XoEIW8QzYz", tint:"#72d1bd"},
  {dir:"diff-eq",         name:"Differential Equations and Numerical Analysis", id:"1_3J7Yw4hKXb5aZ2aM2ADdIQLNjmPmHyv", tint:"#8db6ee"},
  {dir:"data-structures", name:"Data Structures and Problem Solving",           id:"1PRXov8l6FFvSjSW3g9ec1deHqJnQLkKC", tint:"#c69bf0"},
  {dir:"software-eng",    name:"Advanced Software Engineering",                 id:"1Qar9zZ-7TKuyF59-j-t892_KT1Pw3V9C", tint:"#a8d47a"}
];
// -----------------------------------------------------------

var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function url(id){ return "https://drive.google.com/drive/folders/"+id; }
function el(t,c,x){ var e=document.createElement(t); if(c) e.className=c; if(x!=null) e.textContent=x; return e; }
function link(x,h){ var a=el("a",null,x); a.href=h; a.target="_blank"; a.rel="noopener"; return a; }
function folderSvg(tint){
  return '<svg viewBox="0 0 64 52" aria-hidden="true"><path d="M4 9a5 5 0 0 1 5-5h14l6 6h26a5 5 0 0 1 5 5v28a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z" fill="'+tint+'" opacity=".55"/><path d="M4 19a5 5 0 0 1 5-5h46a5 5 0 0 1 5 5v24a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z" fill="'+tint+'"/><path d="M4 19a5 5 0 0 1 5-5h46a5 5 0 0 1 5 5v3H4z" fill="#fff" opacity=".18"/></svg>';
}

/* ---------- wallpaper ---------- */
(function(){
  var c=document.getElementById("wall"), x=c.getContext("2d"), stars=[];
  for(var i=0;i<140;i++) stars.push([Math.random(),Math.random()*0.55,Math.random()*1.3+0.3,Math.random()*6.28]);
  function ridge(w,h,base,amp,seed,col){
    x.beginPath(); x.moveTo(0,h);
    for(var px=0;px<=w;px+=6){
      var t=px/w*seed;
      var y=base+Math.sin(t*1.7)*amp*0.5+Math.sin(t*4.3+seed)*amp*0.28+Math.sin(t*9.1+seed*2)*amp*0.12;
      x.lineTo(px,h*y);
    }
    x.lineTo(w,h); x.closePath(); x.fillStyle=col; x.fill();
  }
  function draw(time){
    var d=window.devicePixelRatio||1, w=innerWidth, h=innerHeight;
    if(c.width!==w*d){ c.width=w*d; c.height=h*d; }
    x.setTransform(d,0,0,d,0,0);
    var g=x.createLinearGradient(0,0,0,h);
    g.addColorStop(0,"#0c1424"); g.addColorStop(.45,"#1d2540"); g.addColorStop(.72,"#5a3a52"); g.addColorStop(.9,"#c0715a");
    x.fillStyle=g; x.fillRect(0,0,w,h);
    var s=x.createRadialGradient(w*.72,h*.7,0,w*.72,h*.7,h*.45);
    s.addColorStop(0,"rgba(255,190,110,.55)"); s.addColorStop(1,"rgba(255,190,110,0)");
    x.fillStyle=s; x.fillRect(0,0,w,h);
    var tt=(time||0)/1000;
    stars.forEach(function(p){ x.globalAlpha=0.35+0.45*Math.abs(Math.sin(p[3]+tt*0.6)); x.fillStyle="#fff"; x.fillRect(p[0]*w,p[1]*h,p[2],p[2]); });
    x.globalAlpha=1;
    ridge(w,h,.70,.12,5,"#3b2c45");
    ridge(w,h,.78,.10,8,"#2a2238");
    ridge(w,h,.86,.08,13,"#1a1726");
    ridge(w,h,.93,.05,21,"#100e18");
    if(!reduce) requestAnimationFrame(draw);
  }
  addEventListener("resize",function(){ if(reduce) draw(0); });
  draw(0); if(!reduce) requestAnimationFrame(draw);
})();

/* ---------- files ---------- */
var grid=document.getElementById("grid"), rows=document.getElementById("rows"), sideC=document.getElementById("sideCourses");
COURSES.forEach(function(c){
  var a=el("a","item"); a.href=url(c.id); a.target="_blank"; a.rel="noopener";
  a.innerHTML=folderSvg(c.tint); a.appendChild(el("span","n",c.name));
  grid.appendChild(a);
  var tr=el("tr"), td=el("td"), la=link("",url(c.id)); la.innerHTML=folderSvg(c.tint); la.appendChild(document.createTextNode(c.name));
  td.appendChild(la); tr.appendChild(td); rows.appendChild(tr);
  var s=link("",url(c.id)); var sw=el("span","sw"); sw.style.background=c.tint; s.appendChild(sw); s.appendChild(el("span","lbl",c.name)); s.title=c.name;
  sideC.appendChild(s);
});
var countEl=document.getElementById("count");
countEl.textContent=COURSES.length+" folders";
document.getElementById("q").addEventListener("input",function(){
  var q=this.value.trim().toLowerCase(), n=0, items=grid.children, trs=rows.children;
  COURSES.forEach(function(c,i){ var hit=!q||c.name.toLowerCase().indexOf(q)>=0||c.dir.indexOf(q)>=0; if(hit) n++;
    items[i].style.display=hit?"":"none"; trs[i].style.display=hit?"":"none"; });
  document.getElementById("empty").style.display=n?"none":"block";
  countEl.textContent=q?(n+" of "+COURSES.length+" folders"):(COURSES.length+" folders");
});
var view=document.getElementById("view"), vG=document.getElementById("vGrid"), vL=document.getElementById("vList");
function setView(list){ view.classList.toggle("as-list",list); vG.classList.toggle("on",!list); vL.classList.toggle("on",list);
  vG.setAttribute("aria-pressed",!list); vL.setAttribute("aria-pressed",list); try{localStorage.setItem("sm-view",list?"list":"grid");}catch(e){} }
vG.onclick=function(){setView(false)}; vL.onclick=function(){setView(true)};
try{ if(localStorage.getItem("sm-view")==="list") setView(true); }catch(e){}

/* ---------- clock ---------- */
function tick(){ var d=new Date(); document.getElementById("clock").textContent=
  d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"})+"   "+d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"}); }
tick(); setInterval(tick,15000);

/* ---------- boot ---------- */
(function(){
  var boot=document.getElementById("boot"), bl=document.getElementById("bootlog"), done=false;
  var seen=false; try{ seen=sessionStorage.getItem("sm-booted")==="1"; }catch(e){}
  function finish(){ if(done) return; done=true; boot.classList.add("gone"); try{sessionStorage.setItem("sm-booted","1");}catch(e){} setTimeout(function(){boot.remove();},450); }
  if(reduce||seen||innerWidth<861){ boot.remove(); return; }
  var lines=["<b>Sophomore Materials</b> 2.0 tty1","","Mounting /home/student/materials"];
  COURSES.forEach(function(c){ lines.push("[ <span class=ok>OK</span> ] Mounted "+c.dir+"/"); });
  lines.push("[ <span class=ok>OK</span> ] Reached target Graphical Interface","","Welcome, student.");
  var i=0; (function next(){ if(done) return; if(i<lines.length){ var d=el("div"); d.innerHTML=lines[i++]||"&nbsp;"; bl.appendChild(d); setTimeout(next,110); } else setTimeout(finish,500); })();
  boot.addEventListener("click",finish); addEventListener("keydown",finish,{once:true});
})();
</script>
</body>
</html>
