<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sophomore Materials</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a Linux desktop at dusk. Glass top bar and one file manager window over a drawn mountain wallpaper; plain app layout on phones. */
:root{
  color-scheme: dark;
  --sky:#0f1a2b;
  --panel:rgba(12,17,26,.62);
  --win:rgba(26,32,42,.82);
  --winsolid:#1b222c;
  --side:rgba(255,255,255,.035);
  --ink:#ece6d8;
  --dim:#8f9aa8;
  --amber:#f2b25a;
  --aqua:#72d1bd;
  --rose:#ef7f78;
  --sel:rgba(242,178,90,.16);
  --line:rgba(236,230,216,.10);
  --ui:"Ubuntu",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Ubuntu Mono",ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--ui);color:var(--ink);font-size:14px;background:var(--sky);overflow:hidden}
a{color:var(--aqua)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#wall{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.shell{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:auto 1fr}

/* top bar */
.topbar{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:5px 12px;background:var(--panel);font-size:13px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.tb-left{display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:7px;font-weight:600}
.logo svg{width:16px;height:16px}
.ws{display:flex;gap:5px}
.ws i{width:7px;height:7px;border-radius:4px;background:var(--dim);opacity:.5}
.ws i.on{width:20px;background:var(--amber);opacity:1}
.loc{font-weight:600;letter-spacing:.01em;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clock{font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:.01em;white-space:nowrap}
.tb-right{display:flex;justify-content:flex-end;align-items:center;gap:12px;color:var(--ink)}

/* desktop */
.desktop{position:relative;min-height:0;padding:28px 24px 32px;display:grid;
  grid-template-columns:minmax(0,1080px);justify-content:center;perspective:1800px}
.win{
  display:flex;flex-direction:column;min-height:0;
  background:var(--win);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);
  box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 0 0 1px rgba(0,0,0,.45),0 40px 90px -12px rgba(0,0,0,.7),0 14px 28px rgba(0,0,0,.35);
  transform-style:preserve-3d;transition:transform .3s ease-out;will-change:transform;
}
@media (prefers-reduced-motion:no-preference) and (min-width:861px){
  .win{animation:winIn .55s cubic-bezier(.2,.8,.2,1) both}
  @keyframes winIn{from{opacity:0;transform:translateY(24px) scale(.95) rotateX(8deg)}}
}
.bar{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid rgba(0,0,0,.45);
  background:linear-gradient(#323a47,#262c36);box-shadow:inset 0 1px 0 rgba(255,255,255,.09);font-size:13.5px;font-weight:700;user-select:none}
.bar .t{flex:1;text-align:center;color:var(--ink)}
.ctl{display:flex;gap:7px}
.ctl i{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.09);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.ctl svg{width:10px;height:10px}
.ctl .c{background:linear-gradient(#f0703f,#d8491a);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.bar .spacer{width:82px}

/* file manager */
.fm{flex:1;min-height:0;display:grid;grid-template-columns:190px minmax(0,1fr)}
.side{background:var(--side);border-right:1px solid var(--line);padding:12px 8px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.side h3{margin:10px 10px 6px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.side h3:first-child{margin-top:0}
.side button,.side a{
  display:flex;align-items:center;gap:9px;width:100%;padding:6px 10px;border-radius:7px;
  background:none;border:0;color:var(--ink);font:inherit;font-size:13px;text-align:left;cursor:pointer;text-decoration:none;
}
.side button:hover,.side a:hover{background:rgba(255,255,255,.06)}
.side button.on,.side a.on{background:var(--sel);color:var(--amber)}
.side svg{width:15px;height:15px;flex:none}
.side .sw{width:9px;height:9px;border-radius:3px;flex:none}
.side .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main{display:flex;flex-direction:column;min-height:0}
.crumbs{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:13px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:7px;padding:5px 10px;color:var(--dim)}
.search:focus-within{border-color:var(--amber)}
.search svg{width:15px;height:15px;flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:inherit;font-size:13px}
.search input::placeholder{color:var(--dim)}
.empty{display:none;color:var(--dim);padding:24px 4px;text-align:center}
.vbtn{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.vbtn button{background:none;border:0;color:var(--dim);padding:5px 8px;cursor:pointer;display:grid;place-items:center}
.vbtn button.on{background:rgba(255,255,255,.08);color:var(--ink)}
.vbtn svg{width:15px;height:15px}
.in-folder .vbtn{display:none}
.view{flex:1;min-height:0;overflow:auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.item{display:grid;justify-items:center;align-content:start;gap:10px;padding:16px 8px 12px;border-radius:10px;text-decoration:none;color:var(--ink);text-align:center;border:1px solid transparent}
.item:hover{background:rgba(255,255,255,.06);border-color:var(--line)}
.item:hover svg{transform:translateY(-2px)}
.item svg .front,.fico svg .front{transform-box:fill-box;transform-origin:50% 100%}
.item svg .sheet,.fico svg .sheet{transform-box:fill-box}
.item:hover svg .front,.f:hover .fico svg .front{transform:skewX(-7deg) scaleY(.84)}
.item:hover svg .sheet,.f:hover .fico svg .sheet{transform:translateY(-3px)}
.item svg{width:68px;height:55px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45))}
.item .n{font-size:13px;font-weight:500;line-height:1.3;text-wrap:balance}
.list{display:none;width:100%;border-collapse:collapse;font-size:13px}
.list th{text-align:left;font-weight:500;color:var(--dim);font-size:12px;padding:6px 10px;border-bottom:1px solid var(--line)}
.list td{padding:8px 10px;border-bottom:1px solid var(--line)}
.list tr:hover td{background:rgba(255,255,255,.04)}
.list a{color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:10px}
.list a svg{width:22px;height:18px;flex:none}
.view.as-list .grid{display:none}
.view.as-list .list{display:table}
.statusbar{display:flex;justify-content:space-between;gap:10px;padding:7px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--dim)}

/* folder contents */
.back{display:none;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.22);color:var(--ink);cursor:pointer;flex:none}
.back svg{width:16px;height:16px}
.in-folder .back{display:flex}
.files{display:none;list-style:none;margin:0;padding:0}
.in-folder .files{display:block}
.in-folder .grid,.in-folder .list{display:none!important}
.f{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;border:1px solid transparent}
.f:hover{background:rgba(255,255,255,.05);border-color:var(--line)}
.f a{flex:1;min-width:0;display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none}
.badge{flex:none;width:38px;height:42px;border-radius:7px 12px 7px 7px;display:grid;place-items:center;font:700 11px var(--mono);letter-spacing:.04em;color:#1a1a1a;text-transform:uppercase;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -4px 0 rgba(0,0,0,.18),0 4px 10px rgba(0,0,0,.35);background-image:linear-gradient(rgba(255,255,255,.25),rgba(255,255,255,0) 60%)!important}
.fn{min-width:0;display:flex;flex-direction:column;gap:2px}
.fn b{font-weight:500;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fn small{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
.new{font:600 10px var(--ui);color:#111;background:var(--amber);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.del{display:none;background:none;border:1px solid var(--line);color:var(--rose);border-radius:7px;padding:5px 9px;font:inherit;font-size:12px;cursor:pointer}
.admin .del{display:block}
.del.ren{color:var(--ink)}
.note{color:var(--dim);padding:28px 8px;text-align:center}
.up{display:none;align-items:center;gap:6px;background:var(--amber);color:#111;border:0;border-radius:8px;padding:7px 12px;font:600 13px var(--ui);cursor:pointer;flex:none}
.admin.in-folder .up{display:flex}
.up svg{width:15px;height:15px}
.up.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.fico{flex:none;width:38px;height:38px;display:grid;place-items:center}
.fico svg{width:34px;height:28px}
.drop{outline:2px dashed var(--amber);outline-offset:-8px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;background:var(--winsolid);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13px;box-shadow:0 12px 30px rgba(0,0,0,.4);display:none;max-width:calc(100% - 32px)}
.toast.on{display:block}
.adminlink{background:none;border:0;color:var(--dim);font:inherit;font-size:12px;cursor:pointer;padding:0}
.adminlink:hover{color:var(--ink)}
.dlg{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);display:none;place-items:center;padding:16px}
.dlg.on{display:grid}
.dlg form{width:min(380px,100%);background:var(--winsolid);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:12px}
.dlg h2{margin:0;font-size:16px}
.dlg p{margin:0;color:var(--dim);font-size:13px;line-height:1.5}
.dlg select{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--ink);font:inherit;font-size:15px}
.dlg select option{background:var(--winsolid)}
.dlg input[type=datetime-local]{color-scheme:dark}
.dlg input{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--ink);font:inherit;font-size:15px}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px}
.dlg button{border-radius:8px;padding:8px 14px;font:600 13px var(--ui);cursor:pointer;border:1px solid var(--line);background:none;color:var(--ink)}
.dlg button.pri{background:var(--amber);color:#111;border:0}

/* course emblems */
.em{fill:none;stroke:rgba(16,20,28,.72);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.em .glass{fill:rgba(255,255,255,0);transition:fill .25s}
.em .led,.em .ball{fill:rgba(16,20,28,.72);transition:fill .25s}
.em .n{fill:rgba(255,255,255,.7);transition:fill .25s}
.em .gr{transform-box:fill-box;transform-origin:center}
.item:hover .em .glass,.item:focus-visible .em .glass,.item:active .em .glass,.list a:hover .em .glass{fill:#fff4b8}
.item:hover .em .led,.item:focus-visible .em .led,.item:active .em .led,.list a:hover .em .led{fill:#ff4d2e}
@media (prefers-reduced-motion:no-preference){
  .item:hover .em .rays,.item:focus-visible .em .rays,.item:active .em .rays,.list a:hover .em .rays{animation:emPulse .8s ease-in-out infinite alternate}
  .item:hover .em-gate .in,.item:focus-visible .em-gate .in,.item:active .em-gate .in,.list a:hover .em-gate .in{stroke-dasharray:3 2.2;animation:emFlow .55s linear infinite}
  .item:hover .em .bx,.item:focus-visible .em .bx,.item:active .em .bx,.list a:hover .em .bx{animation:emBx 1.1s linear infinite}
  .item:hover .em .by,.item:focus-visible .em .by,.item:active .em .by,.list a:hover .em .by{animation:emBy 1.1s infinite}
  .item:hover .em .wv,.item:focus-visible .em .wv,.item:active .em .wv,.list a:hover .em .wv{animation:emWave .9s linear infinite}
  .item:hover .em .n,.item:focus-visible .em .n,.item:active .em .n,.list a:hover .em .n{animation:emNode 1.2s ease-in-out infinite}
  .item:hover .em .n2,.item:focus-visible .em .n2,.item:active .em .n2,.list a:hover .em .n2{animation-delay:.2s}
  .item:hover .em .n3,.item:focus-visible .em .n3,.item:active .em .n3,.list a:hover .em .n3{animation-delay:.4s}
  .item:hover .em .gr,.item:focus-visible .em .gr,.item:active .em .gr,.list a:hover .em .gr{animation:emSpin 2.4s linear infinite}
}
@keyframes emPulse{from{opacity:.25}to{opacity:1}}
@keyframes emFlow{to{stroke-dashoffset:-5.2}}
@keyframes emBx{to{transform:translateX(26px)}}
@keyframes emBy{0%{transform:translateY(0);animation-timing-function:cubic-bezier(.33,.66,.66,1)}50%{transform:translateY(-12.6px);animation-timing-function:cubic-bezier(.33,0,.66,.33)}100%{transform:translateY(0)}}
@keyframes emWave{to{transform:translateX(-16px)}}
@keyframes emNode{0%,100%{fill:rgba(255,255,255,.7)}35%{fill:#141a24}}
@keyframes emSpin{to{transform:rotate(360deg)}}

/* course tiles */
.item svg.tile{width:122px;height:98px;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45));transform-origin:50% 100%}
.list a svg.tile{width:30px;height:24px;filter:none}
.tile .k{fill:none;stroke:rgba(14,18,26,.8);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tile .w{fill:rgba(255,255,255,.88)}
.tile .w2{fill:rgba(255,255,255,.5)}
.tile .pinb{fill:#e5484d;stroke:rgba(14,18,26,.85);stroke-width:1.6}
.tile .route{stroke-dasharray:3 3;opacity:.8}
.tile .pwr{stroke:#ffd34d;stroke-width:1.6;stroke-dasharray:1 3;opacity:.0}
.tile .core,.tile .sq{fill:rgba(255,255,255,.62)}
.tile .ball{fill:rgba(14,18,26,.85)}
.tile .sk,.tile .fl,.tile .ly,.tile .gr2{transform-box:view-box}
.tile .sk{transform-origin:60px 46px}
.tile .eye{fill:#141a24;transition:fill .25s}
.tile .gr2{transform-origin:98px 24px}
.fico{width:38px;height:38px}
.fico svg.sub{width:34px;height:34px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))}
.win{--accent:transparent}
.bar{box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 -2px 0 var(--accent)}
.loc .dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:8px;vertical-align:0}
@media (prefers-reduced-motion:no-preference){
  .item svg.tile{transition:transform .35s cubic-bezier(.2,.8,.2,1),filter .35s}
  .item:hover svg.tile,.item:focus-visible svg.tile{transform:perspective(420px) rotateX(10deg) translateY(-4px);filter:drop-shadow(0 18px 18px rgba(0,0,0,.5))}
  .tile .sk{transition:transform .35s ease,opacity .3s}
  .item:hover .tile .sk,.item:focus-visible .tile .sk,.item:active .tile .sk,#zoomTile .tile .sk,.list a:hover .tile .sk{animation:tShake .5s ease-in-out infinite}
  .tile .ly{transition:transform .4s cubic-bezier(.2,.8,.2,1)}
  .item:hover .tile .pin,.item:focus-visible .tile .pin,.item:active .tile .pin,#zoomTile .tile .pin,.list a:hover .tile .pin{animation:tPin .55s cubic-bezier(.3,1.6,.5,1) both}
  .item:hover .tile .p2,.item:focus-visible .tile .p2,.item:active .tile .p2,#zoomTile .tile .p2,.list a:hover .tile .p2{animation-delay:.15s}
  .item:hover .tile .p3,.item:focus-visible .tile .p3,.item:active .tile .p3,#zoomTile .tile .p3,.list a:hover .tile .p3{animation-delay:.3s}
  .item:hover .tile .route,.item:focus-visible .tile .route,.item:active .tile .route,#zoomTile .tile .route,.list a:hover .tile .route{animation:tDash .7s linear infinite}
  .item:hover .tile .pwr,.item:focus-visible .tile .pwr,.item:active .tile .pwr,#zoomTile .tile .pwr,.list a:hover .tile .pwr{opacity:1;animation:tDash .4s linear infinite}
  .item:hover .tile .tr,.item:focus-visible .tile .tr,.item:active .tile .tr,#zoomTile .tile .tr,.list a:hover .tile .tr{stroke-dasharray:4 3;animation:tDash .5s linear infinite}
  .item:hover .tile .core,.item:focus-visible .tile .core,.item:active .tile .core,#zoomTile .tile .core,.list a:hover .tile .core{animation:tCore 1s ease-in-out infinite}
  .item:hover .tile .c2,.item:focus-visible .tile .c2,.item:active .tile .c2,#zoomTile .tile .c2,.list a:hover .tile .c2{animation-delay:.12s}
  .item:hover .tile .c3,.item:focus-visible .tile .c3,.item:active .tile .c3,#zoomTile .tile .c3,.list a:hover .tile .c3{animation-delay:.24s}
  .item:hover .tile .c4,.item:focus-visible .tile .c4,.item:active .tile .c4,#zoomTile .tile .c4,.list a:hover .tile .c4{animation-delay:.36s}
  .item:hover .tile .bx,.item:focus-visible .tile .bx,.item:active .tile .bx,#zoomTile .tile .bx,.list a:hover .tile .bx{animation:tBx 1.3s linear infinite}
  .item:hover .tile .by,.item:focus-visible .tile .by,.item:active .tile .by,#zoomTile .tile .by,.list a:hover .tile .by{animation:tBy 1.3s infinite}
  .item:hover .tile .sq,.item:focus-visible .tile .sq,.item:active .tile .sq,#zoomTile .tile .sq,.list a:hover .tile .sq{animation:tNode 1.8s ease-in-out infinite}
  .item:hover .tile .l2,.item:focus-visible .tile .l2,.item:active .tile .l2,#zoomTile .tile .l2,.list a:hover .tile .l2{animation-delay:.15s}
  .item:hover .tile .l3,.item:focus-visible .tile .l3,.item:active .tile .l3,#zoomTile .tile .l3,.list a:hover .tile .l3{animation-delay:.3s}
  .item:hover .tile .t1,.item:focus-visible .tile .t1,.item:active .tile .t1,#zoomTile .tile .t1,.list a:hover .tile .t1{animation-delay:.45s}
  .item:hover .tile .t2,.item:focus-visible .tile .t2,.item:active .tile .t2,#zoomTile .tile .t2,.list a:hover .tile .t2{animation-delay:.6s}
  .item:hover .tile .t3,.item:focus-visible .tile .t3,.item:active .tile .t3,#zoomTile .tile .t3,.list a:hover .tile .t3{animation-delay:.75s}
  .item:hover .tile .gr2,.item:focus-visible .tile .gr2,.item:active .tile .gr2,#zoomTile .tile .gr2,.list a:hover .tile .gr2{animation:emSpin 2.4s linear infinite}
}
.item:hover .tile .eye,.item:focus-visible .tile .eye,.item:active .tile .eye,#zoomTile .tile .eye,.list a:hover .tile .eye{fill:#ff3b1f;filter:drop-shadow(0 0 3px #ff3b1f)}
.item:hover .tile .ly1,.item:focus-visible .tile .ly1,.item:active .tile .ly1,#zoomTile .tile .ly1,.list a:hover .tile .ly1{transform:translateY(-11px)}
.item:hover .tile .ly3,.item:focus-visible .tile .ly3,.item:active .tile .ly3,#zoomTile .tile .ly3,.list a:hover .tile .ly3{transform:translateY(11px)}
@keyframes tPin{from{transform:translateY(-16px);opacity:0}to{transform:none;opacity:1}}
@keyframes tDash{to{stroke-dashoffset:-12}}
@keyframes tCore{0%,100%{fill:rgba(255,255,255,.62)}40%{fill:#ffe066}}
@keyframes tBx{to{transform:translateX(72px)}}
@keyframes tBy{0%{transform:translateY(0);animation-timing-function:cubic-bezier(.33,.66,.66,1)}50%{transform:translateY(-38px);animation-timing-function:cubic-bezier(.33,0,.66,.33)}100%{transform:translateY(0)}}
@keyframes tShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes tNode{0%,100%{fill:rgba(255,255,255,.62)}30%{fill:#141a24}}

/* opening a course */
#grid .item.chosen{visibility:hidden}
#zoomTile{position:fixed;z-index:40;pointer-events:none;transform-origin:0 0;filter:drop-shadow(0 30px 40px rgba(0,0,0,.55))}
#zoomTile{perspective:520px}
#zoomTile .door{position:absolute;top:0;width:50%;height:100%;overflow:hidden;transform-style:preserve-3d}
#zoomTile .dl{left:0;transform-origin:0 50%}
#zoomTile .dr{right:0;transform-origin:100% 50%}
#zoomTile .door svg{width:200%;height:100%;display:block}
#zoomTile .dr svg{margin-left:-100%}
#zoomTile .burst{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border-radius:50%;background:radial-gradient(circle,#fff 0,var(--tint) 35%,transparent 70%);opacity:0;transform:scale(0)}
#zoomTile .spark{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:var(--tint);box-shadow:0 0 6px var(--tint),0 0 2px #fff;opacity:0}

function byName(a,b){ return a.localeCompare(b,undefined,{numeric:true,sensitivity:"base"}); }
function term(n){ n=n.toLowerCase(); if(/(^|[^a-z])(fall|autumn)/.test(n)) return 0; if(/(^|[^a-z])spring/.test(n)) return 1; if(/(^|[^a-z])summer/.test(n)) return 2; return 3; }

/* ---------- wallpaper ---------- */
(function(){
  var c=$("wall"), x=c.getContext("2d"), stars=[];
  for(var i=0;i<140;i++) stars.push([Math.random(),Math.random()*0.55,Math.random()*1.3+0.3,Math.random()*6.28]);
  var mx=.5;
  addEventListener("mousemove",function(e){ mx=e.clientX/innerWidth; if(reduce) draw(0); });
  function ridge(w,h,base,amp,seed,col,off){
    x.beginPath(); x.moveTo(0,h);
    for(var px=0;px<=w;px+=6){ var t=(px+(off||0))/w*seed;
      var y=base+Math.sin(t*1.7)*amp*0.5+Math.sin(t*4.3+seed)*amp*0.28+Math.sin(t*9.1+seed*2)*amp*0.12; x.lineTo(px,h*y); }
    x.lineTo(w,h); x.closePath(); x.fillStyle=col; x.fill();
  }
  function draw(time){
    if(innerWidth<861){ if(!reduce) requestAnimationFrame(draw); return; }
    var d=window.devicePixelRatio||1, w=innerWidth, h=innerHeight;
    if(c.width!==w*d||c.height!==h*d){ c.width=w*d; c.height=h*d; }
    x.setTransform(d,0,0,d,0,0);
    var g=x.createLinearGradient(0,0,0,h);
    g.addColorStop(0,"#0c1424"); g.addColorStop(.45,"#1d2540"); g.addColorStop(.72,"#5a3a52"); g.addColorStop(.9,"#c0715a");
    x.fillStyle=g; x.fillRect(0,0,w,h);
    var s=x.createRadialGradient(w*.72,h*.7,0,w*.72,h*.7,h*.45);
    s.addColorStop(0,"rgba(255,190,110,.55)"); s.addColorStop(1,"rgba(255,190,110,0)");
    x.fillStyle=s; x.fillRect(0,0,w,h);
    var tt=(time||0)/1000;
    stars.forEach(function(p){ x.globalAlpha=0.35+0.45*Math.abs(Math.sin(p[3]+tt*0.6)); x.fillStyle="#fff"; x.fillRect(p[0]*w,p[1]*h,p[2],p[2]); });
    x.globalAlpha=1;
    var m=(mx-.5)*2; ridge(w,h,.70,.12,5,"#3b2c45",m*-18); ridge(w,h,.78,.10,8,"#2a2238",m*-40); ridge(w,h,.86,.08,13,"#1a1726",m*-75); ridge(w,h,.93,.05,21,"#100e18",m*-120);
    if(!reduce) requestAnimationFrame(draw);
  }
  addEventListener("resize",function(){ if(reduce) draw(0); });
  draw(0); if(!reduce) requestAnimationFrame(draw);
})();

/* ---------- files from storage ---------- */
var PH=".emptyFolderPlaceholder";
var cache={};
function listDir(path){
  if(cache[path]) return Promise.resolve(cache[path]);
  if(!sb) return Promise.reject(new Error("offline"));
  return sb.storage.from(BUCKET).list(path,{limit:1000,sortBy:{column:"name",order:"asc"}}).then(function(r){
    if(r.error) throw r.error;
    var out={dirs:[],files:[]};
    (r.data||[]).forEach(function(f){ if(f.name===PH) return; if(f.id) out.files.push(f); else out.dirs.push(f.name); });
    cache[path]=out; return out;
  });
}
// every file under a path, up to 4 levels deep: [[folderPath, file], ...]
function walk(path,depth){
  return listDir(path).then(function(l){
    var here=l.files.map(function(f){ return [path,f]; });
    if(depth<=0||!l.dirs.length) return here;
    return Promise.all(l.dirs.map(function(d){ return walk(path+"/"+d,depth-1).catch(function(){return [];}); }))
      .then(function(sub){ return here.concat.apply(here,sub); });
  });
}
function pubUrl(path,name){ return sb.storage.from(BUCKET).getPublicUrl(path+"/"+name).data.publicUrl; }
function pretty(path){ var p=path.split("/"), c=course(p[0]); return [c?c.name:p[0]].concat(p.slice(1)).join(" › "); }
function folderRow(path,name){
  var li=el("li","f"), a=el("a"); a.href="#"+encodeURI(path+"/"+name);
  var ic=el("span","fico"); ic.innerHTML=subSvg(course(path.split("/")[0]).tint,name); a.appendChild(ic);
  var fn=el("span","fn"); fn.appendChild(el("b",null,name)); a.appendChild(fn);
  li.appendChild(a);
  var rn=el("button","del ren","Rename"); rn.type="button"; rn.onclick=function(){ askRename(path,name,true); }; li.appendChild(rn);
  var del=el("button","del","Delete"); del.type="button"; del.onclick=function(){ removeFolder(path,name,del); }; li.appendChild(del);
  return li;
}
function fileRow(path,f,showFolder){
  var li=el("li","f"), a=el("a"); a.href=pubUrl(path,f.name); a.target="_blank"; a.rel="noopener";
  var ext=(f.name.split(".").pop()||"").toLowerCase(); if(ext===f.name.toLowerCase()) ext="file";
  var b=el("span","badge",ext.slice(0,4)); b.style.background=EXT[ext]||"#8f9aa8"; a.appendChild(b);
  var fn=el("span","fn"), nm=el("b",null,f.name);
  var made=new Date(f.created_at||f.updated_at||0); if(Date.now()-made<2*864e5) nm.appendChild(el("span","new","NEW"));
  fn.appendChild(nm);
  var meta=[when(f.updated_at||f.created_at), size(f.metadata&&f.metadata.size)].filter(Boolean).join("  ·  ");
  if(showFolder) meta=pretty(path)+"  ·  "+meta;
  fn.appendChild(el("small",null,meta)); a.appendChild(fn); li.appendChild(a);
  var rn=el("button","del ren","Rename"); rn.type="button"; rn.onclick=function(){ askRename(path,f.name,false); }; li.appendChild(rn);
  var del=el("button","del","Delete"); del.type="button";
  del.onclick=function(){ removeFile(path,f.name,del); }; li.appendChild(del);
  return li;
}

/* ---------- routing ---------- */
var current=null;
function route(){
  var path=decodeURI((location.hash||"").slice(1)).replace(/^\/+|\/+$/g,""), c=course(path.split("/")[0]);
  current=c?path:null;
  $("q").value="";
  var top=current?current.split("/")[0]:null;
  document.querySelectorAll("#sideCourses a").forEach(function(a){ a.classList.toggle("on",a.dataset.dir===top); });
  $("sideHome").classList.toggle("on",!current);
  if(!c){
    fm.classList.remove("in-folder"); $("loc").textContent="Home"; document.title="Sophomore Materials"; $("winFiles").style.setProperty("--accent","transparent");
    $("q").placeholder="Search folders and files";
    showHome(""); return;
  }
  var name=current.split("/").pop(), here=current.indexOf("/")<0?c.name:name;
  fm.classList.add("in-folder"); $("loc").textContent=pretty(current); var dot=el("span","dot"); dot.style.background=c.tint; $("loc").insertBefore(dot,$("loc").firstChild); $("winFiles").style.setProperty("--accent",c.tint); document.title=here+" · Sophomore Materials";
  $("q").placeholder="Search in "+here;
  renderFolder("");
}
function renderFolder(q){
  var path=current; files.textContent=""; files.appendChild(el("li","note","Loading…"));
  var job=q?walk(path,3).then(function(all){ return {search:all}; }):listDir(path);
  job.then(function(l){
    if(path!==current) return;
    files.textContent="";
    if(l.search){
      var hits=l.search.filter(function(p){ return p[1].name.toLowerCase().indexOf(q)>=0; }).sort(function(a,b){ return byName(a[0]+"/"+a[1].name,b[0]+"/"+b[1].name); });
      hits.forEach(function(p){ files.appendChild(fileRow(p[0],p[1],p[0]!==path)); });
      if(!hits.length) files.appendChild(el("li","note","No files match your search."));
      countEl.textContent=hits.length+(hits.length===1?" file":" files")+" found";
      return;
    }
    l.dirs.slice().sort(byName).forEach(function(d){ files.appendChild(folderRow(path,d)); });
    var fl=l.files.slice().sort(function(a,b){ return byTerm(a.name,b.name); });
    fl.forEach(function(f){ files.appendChild(fileRow(path,f,false)); });
    if(!l.dirs.length&&!fl.length) files.appendChild(el("li","note","Nothing here yet."));
    var parts=[];
    if(l.dirs.length) parts.push(l.dirs.length+(l.dirs.length===1?" folder":" folders"));
    parts.push(fl.length+(fl.length===1?" file":" files"));
    countEl.textContent=parts.join(", ");
  }).catch(function(){ files.textContent=""; files.appendChild(el("li","note","Couldn't load the files. Check your connection and refresh.")); });
}
function showHome(q){
  var n=0, items=grid.children, trs=rows.children;
  COURSES.forEach(function(c,i){ var hit=!q||c.name.toLowerCase().indexOf(q)>=0; if(hit) n++; items[i].style.display=hit?"":"none"; trs[i].style.display=hit?"":"none"; });
  files.textContent="";
  view.classList.toggle("searching",!!q);
  if(!q){ fm.classList.remove("in-folder"); $("empty").style.display="none"; countEl.textContent=COURSES.length+" folders"; return; }
  Promise.all(COURSES.map(function(c){ return walk(c.dir,3).catch(function(){return [];}); }))
  .then(function(all){
    if($("q").value.trim().toLowerCase()!==q||current) return;
    var hits=[].concat.apply([],all).filter(function(p){ return p[1].name.toLowerCase().indexOf(q)>=0; }).sort(function(a,b){ return byName(a[0]+"/"+a[1].name,b[0]+"/"+b[1].name); });
    files.textContent="";
    hits.forEach(function(p){ files.appendChild(fileRow(p[0],p[1],true)); });
    files.style.display=hits.length?"block":"";
    $("empty").style.display=(n||hits.length)?"none":"block";
    countEl.textContent=n+(n===1?" folder":" folders")+", "+hits.length+(hits.length===1?" file":" files");
  });
}
$("q").addEventListener("input",function(){ var q=this.value.trim().toLowerCase(); if(current) renderFolder(q); else { files.style.display=""; showHome(q); } });

function ago(iso){ var m=Math.max(0,Math.round((Date.now()-new Date(iso))/60000)); if(m<60) return m+"m"; var h=Math.round(m/60); if(h<48) return h+"h"; return Math.round(h/24)+"d"; }
function loadRecent(){
  var box=$("recent"); if(!sb){ return; }
  sb.from("updates").select("*").order("id",{ascending:false}).limit(40).then(function(r){
    var dayAgo=Date.now()-864e5, rows=(r.data||[]).filter(function(x){ return course(x.course)&&new Date(x.created_at)>=dayAgo; }), seen={};
    rows=rows.filter(function(x){ var k=x.course+"/"+x.file_name; if(seen[k]) return false; seen[k]=1; return true; });
    var dirs={}; rows.forEach(function(x){ var p=(x.course+"/"+x.file_name).split("/"); p.pop(); dirs[p.join("/")]=1; });
    return Promise.all(Object.keys(dirs).map(function(d){ return listDir(d).then(function(l){ return [d,l.files.map(function(f){return f.name;})]; }).catch(function(){ return [d,[]]; }); }))
      .then(function(ls){
        var have={}; ls.forEach(function(e){ e[1].forEach(function(n){ have[e[0]+"/"+n]=1; }); });
        var live=rows.filter(function(x){ return have[x.course+"/"+x.file_name]; }).slice(0,6);
        box.textContent="";
        if(!live.length){ box.appendChild(el("li","muted","Nothing new yet")); return; }
        live.forEach(function(x){
          var parts=(x.course+"/"+x.file_name).split("/"), name=parts.pop(), dir=parts.join("/"), c=course(x.course);
          var a=el("a","pr"); a.href=pubUrl(dir,name); a.target="_blank"; a.rel="noopener";
          var ext=(name.split(".").pop()||"").toLowerCase(); if(ext===name.toLowerCase()) ext="file";
          var b=el("span","badge",ext.slice(0,4)); b.style.background=EXT[ext]||"#8f9aa8"; a.appendChild(b);
          var tx=el("span","tx"); tx.appendChild(el("b",null,name));
          var sm=el("small"); var dot=el("span","cdot"); dot.style.background=c.tint; sm.appendChild(dot); sm.appendChild(document.createTextNode(pretty(dir))); tx.appendChild(sm);
          a.appendChild(tx); a.appendChild(el("span","ago",ago(x.created_at)));
          var li=el("li"); li.appendChild(a); box.appendChild(li);
        });
      });
  });
}
var dues=[];
function left(iso){
  var ms=new Date(iso)-Date.now(); if(ms<=0) return {t:"due",cls:"urgent"};
  var m=Math.floor(ms/60000), d=Math.floor(m/1440), h=Math.floor(m%1440/60), mi=m%60;
  var t=d>0?(d+"d "+h+"h"):h>0?(h+"h "+mi+"m"):(mi+"m");
  return {t:t,cls:ms<864e5?"urgent":ms<3*864e5?"soon":""};
}
function renderDues(){
  var box=$("dues"); box.textContent="";
  var up=dues.filter(function(d){ return new Date(d.due_at)>Date.now(); });
  if(!up.length){ box.appendChild(el("li","muted","No upcoming deadlines")); return; }
  up.forEach(function(d){
    var c=course(d.course), row=el("div","pr"), tx=el("span","tx");
    tx.appendChild(el("b",null,d.title));
    var sm=el("small"); var dot=el("span","cdot"); dot.style.background=c?c.tint:"#8f9aa8"; sm.appendChild(dot);
    sm.appendChild(document.createTextNode(new Date(d.due_at).toLocaleString(undefined,{weekday:"short",day:"numeric",month:"short",hour:"numeric",minute:"2-digit"})+" · "+(c?c.name:d.course)));
    tx.appendChild(sm); row.appendChild(tx);
    var L=left(d.due_at); row.appendChild(el("span","cd"+(L.cls?" "+L.cls:""),L.t));
    var x=el("button","x","×"); x.type="button"; x.setAttribute("aria-label","Delete "+d.title);
    x.onclick=function(){ if(!sure(x)) return; sb.from("deadlines").delete().eq("id",d.id).then(function(r){ if(r.error){ toast("Couldn't delete: "+r.error.message,6000); return; } loadDues(); }); };
    row.appendChild(x);
    var li=el("li"); li.appendChild(row); box.appendChild(li);
  });
}
function loadDues(){
  if(!sb) return;
  sb.from("deadlines").select("*").gt("due_at",new Date().toISOString()).order("due_at").limit(8).then(function(r){ dues=r.data||[]; renderDues(); });
}

$("loginForm").addEventListener("submit",function(e){
  e.preventDefault();
  sb.auth.signInWithOtp({email:$("loginEmail").value.trim(),options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:false}}).then(function(r){
    if(r.error){ toast("Couldn't send the link: "+r.error.message,6000); return; }
    $("loginDlg").classList.remove("on"); toast("Check your email for the sign-in link.",6000);
  });
});
function cleanName(n){ return n.replace(/[^\w.\-() ]+/g,"_").replace(/_+/g,"_").trim(); }
function upload(list){
  if(!isAdmin||!current||!list.length) return;
  var path=current, done=0, failed=0, names=[], top=path.split("/")[0], sub=path.split("/").slice(1).join("/");
  toast("Uploading "+list.length+(list.length===1?" file…":" files…"),60000);
  Promise.all([].map.call(list,function(f){
    var name=cleanName(f.name);
    return sb.storage.from(BUCKET).upload(path+"/"+name,f,{upsert:true,contentType:f.type||undefined}).then(function(r){
      if(r.error){ failed++; return; } done++; names.push(name);
      return sb.from("updates").insert({course:top,file_name:(sub?sub+"/":"")+name,action:"added"});
    });
  })).then(function(){
    delete cache[path]; if(current===path) renderFolder(""); loadRecent();
    toast(failed?(done+" uploaded, "+failed+" failed. Try the failed ones again."):(done===1?"Uploaded "+names[0]:"Uploaded "+done+" files"),5000);
  });
}
function sure(b){
  if(b.dataset.sure==="1") return true;
  var t=b.textContent; b.dataset.sure="1"; b.textContent="Sure?";
  setTimeout(function(){ b.dataset.sure=""; b.textContent=t; },3000); return false;
}
function removeFile(path,name,b){
  if(!isAdmin||!sure(b)) return;
  sb.storage.from(BUCKET).remove([path+"/"+name]).then(function(r){
    if(r.error){ toast("Couldn't delete: "+r.error.message,6000); return; }
    delete cache[path]; if(current===path) renderFolder(""); toast("Deleted "+name);
  });
}
function removeFolder(path,name,b){
  if(!isAdmin) return;
  var full=path+"/"+name;
  listDir(full).then(function(l){
    if(l.dirs.length||l.files.length){ toast("Empty the folder "+name+" first, then delete it.",5000); return; }
    if(!sure(b)) return;
    sb.storage.from(BUCKET).remove([full+"/"+PH]).then(function(r){
      if(r.error){ toast("Couldn't delete: "+r.error.message,6000); return; }
      delete cache[path]; delete cache[full]; if(current===path) renderFolder(""); toast("Deleted folder "+name);
    });
  });
}
function allKeys(path){
  return sb.storage.from(BUCKET).list(path,{limit:1000}).then(function(r){
    if(r.error) throw r.error;
    var keys=[], subs=[];
    (r.data||[]).forEach(function(f){ if(f.id) keys.push(path+"/"+f.name); else subs.push(path+"/"+f.name); });
    return Promise.all(subs.map(allKeys)).then(function(x){ return keys.concat.apply(keys,x); });
  });
}
var renaming=null;
function askRename(path,name,isDir){
  if(!isAdmin) return;
  renaming={path:path,name:name,isDir:isDir};
  var i=$("renameName"); i.value=name; $("renameDlg").classList.add("on"); i.focus();
  var dot=isDir?-1:name.lastIndexOf("."); i.setSelectionRange(0,dot>0?dot:name.length);
}
$("renameCancel").onclick=function(){ $("renameDlg").classList.remove("on"); };
$("renameForm").addEventListener("submit",function(e){
  e.preventDefault();
  var r=renaming, nn=cleanName($("renameName").value);
  if(!r||!nn||nn===r.name){ $("renameDlg").classList.remove("on"); return; }
  if(!r.isDir){ var d=r.name.lastIndexOf("."), ext=d>0?r.name.slice(d):""; if(ext&&nn.toLowerCase().slice(-ext.length)!==ext.toLowerCase()) nn+=ext; }
  var from=r.path+"/"+r.name, to=r.path+"/"+nn;
  $("renameDlg").classList.remove("on"); toast("Renaming…",60000);
  var job=r.isDir
    ? allKeys(from).then(function(keys){ return keys.reduce(function(p,k){ return p.then(function(){ return sb.storage.from(BUCKET).move(k,to+k.slice(from.length)).then(function(x){ if(x.error) throw x.error; }); }); },Promise.resolve()); })
    : sb.storage.from(BUCKET).move(from,to).then(function(x){ if(x.error) throw x.error; });
  job.then(function(){ cache={}; if(current) renderFolder(""); toast("Renamed to "+nn); })
     .catch(function(err){ cache={}; if(current) renderFolder(""); toast("Couldn't rename: "+err.message,6000); });
});
$("upBtn").onclick=function(){ $("fileIn").click(); };
$("fileIn").onchange=function(){ upload(this.files); this.value=""; };
$("newBtn").onclick=function(){ $("folderDlg").classList.add("on"); $("folderName").value=""; $("folderName").focus(); };
$("folderCancel").onclick=function(){ $("folderDlg").classList.remove("on"); };
$("folderForm").addEventListener("submit",function(e){
  e.preventDefault();
  var name=cleanName($("folderName").value), path=current;
  if(!name||!path){ return; }
  var blank=new Blob([""],{type:"text/plain"});
  sb.storage.from(BUCKET).upload(path+"/"+name+"/"+PH,blank,{upsert:true}).then(function(r){
    if(r.error){ toast("Couldn't create the folder: "+r.error.message,6000); return; }
    $("folderDlg").classList.remove("on"); delete cache[path]; if(current===path) renderFolder(""); toast("Created folder "+name);
  });
});
view.addEventListener("dragover",function(e){ if(isAdmin&&current){ e.preventDefault(); view.classList.add("drop"); } });
view.addEventListener("dragleave",function(){ view.classList.remove("drop"); });
view.addEventListener("drop",function(e){ view.classList.remove("drop"); if(isAdmin&&current){ e.preventDefault(); upload(e.dataTransfer.files); } });

route();
loadRecent(); loadDues();

/* ---------- window tilt ---------- */
(function(){
  var win=$("winFiles");
  if(reduce||!window.matchMedia("(min-width:861px) and (pointer:fine)").matches) return;
  var raf=0, tx=0, ty=0;
  addEventListener("mousemove",function(e){
    tx=e.clientX/innerWidth-.5; ty=e.clientY/innerHeight-.5;
    if(!raf) raf=requestAnimationFrame(function(){ raf=0; win.style.transform="rotateY("+(tx*3.5).toFixed(2)+"deg) rotateX("+(-ty*2.5).toFixed(2)+"deg)"; });
  });
  addEventListener("mouseleave",function(){ win.style.transform=""; });
})();

/* ---------- boot ---------- */
(function(){
  var boot=$("boot"), bl=$("bootlog"), done=false;
  var seen=false; try{ seen=sessionStorage.getItem("sm-booted")==="1"; }catch(e){}
  function finish(){ if(done) return; done=true; boot.classList.add("gone"); try{sessionStorage.setItem("sm-booted","1");}catch(e){} setTimeout(function(){boot.remove();},450); }
  if(reduce||seen||innerWidth<861){ boot.remove(); return; }
  var lines=["<b>Sophomore Materials</b> 2.0 tty1","","Mounting /home/student/materials"];
  COURSES.forEach(function(c){ lines.push("[ <span class=ok>OK</span> ] Mounted "+c.dir+"/"); });
  lines.push("[ <span class=ok>OK</span> ] Reached target Graphical Interface","","Welcome, student.");
  var i=0; (function next(){ if(done) return; if(i<lines.length){ var d=el("div"); d.innerHTML=lines[i++]||"&nbsp;"; bl.appendChild(d); setTimeout(next,110); } else setTimeout(finish,500); })();
  boot.addEventListener("click",finish); addEventListener("keydown",finish,{once:true});
})();
</script>
